    <section class="formulario">
        
        <form id="reservaForm" action="guardarReserva.php" method="POST">

            <h3>1. Seleccioná un día</h3>

            <div class="calendar">

                <header>
                    <button type="button" id="prev">◀</button>
                    <span id="monthYear"></span>
                    <button type="button" id="next">▶</button>
                </header>

                <!-- Encabezado de días -->
                <div class="weekdays">
                    <div>Dom</div>
                    <div>Lun</div>
                    <div>Mar</div>

                    <div>Vie</div>

                </div>

                <!-- Días dinámicos -->
                <div class="days" id="days"></div>

            </div>

            <input type="hidden" name="fecha" id="fechaSeleccionada" required>

                <p>
                    <h3>2. Detalles de la reserva</h3>

                    <label>Turno:

                        </select>

                </p>

                        <label>

                        </label>
                    
                    </div>
                </p>
<!--

                    <input type="text" name="nombre" placeholder="Tu nombre" required>
                </p> -->

                    <button type="submit" id="btnReservar" >Confirmar Reserva</button>
